<title>GameFriendCache txt変換</title>
<style>
  :root { color-scheme: light dark; --bg:#f4f6fa; --panel:#fff; --text:#172033; --muted:#64748b; --line:#d9e0ea; --accent:#315ee8; --ok:#16834a; --error:#c0392b; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#101521; --panel:#192233; --text:#edf2fb; --muted:#a6b2c5; --line:#344156; --accent:#82a2ff; --ok:#5bd18b; --error:#ff8585; }
  }
  * { box-sizing:border-box; }
  body { margin:0; padding:calc(28px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(48px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left)); -webkit-text-size-adjust:100%; background:var(--bg); color:var(--text); font:15px/1.65 system-ui,-apple-system,"Segoe UI",sans-serif; }
  main { max-width:900px; margin:auto; }
  h1 { font-size:clamp(23px,4vw,32px); line-height:1.25; margin:0 0 8px; }
  .lead { color:var(--muted); margin:0 0 24px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:20px; margin:16px 0; box-shadow:0 4px 18px #00000008; }
  .drop { display:block; border:2px dashed var(--line); border-radius:12px; padding:30px 18px; text-align:center; cursor:pointer; transition:.15s; }
  .drop.drag { border-color:var(--accent); background:color-mix(in srgb,var(--accent) 9%,transparent); }
  .drop strong { display:block; font-size:18px; margin-bottom:5px; }
  .drop span { color:var(--muted); }
  input[type=file] { position:absolute; width:1px; height:1px; opacity:0; overflow:hidden; }
  .actions { display:flex; flex-wrap:wrap; gap:10px; margin-top:16px; }
  button { border:0; border-radius:9px; padding:10px 16px; font:inherit; font-weight:650; cursor:pointer; background:var(--accent); color:white; }
  button.secondary { background:transparent; color:var(--text); border:1px solid var(--line); }
  button:disabled { opacity:.45; cursor:not-allowed; }
  #status { min-height:26px; color:var(--muted); margin-top:12px; overflow-wrap:anywhere; }
  #status.ok { color:var(--ok); } #status.error { color:var(--error); }
  .stats { display:flex; flex-wrap:wrap; gap:18px; color:var(--muted); font-size:14px; }
  .stats b { color:var(--text); }
  textarea { width:100%; min-height:360px; resize:vertical; border:1px solid var(--line); border-radius:10px; padding:14px; background:var(--bg); color:var(--text); font:13px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace; }
  .note { color:var(--muted); font-size:13px; }
  .tableWrap { overflow-x:auto; border:1px solid var(--line); border-radius:10px; margin:12px 0 18px; max-height:420px; overflow-y:auto; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { padding:8px 12px; text-align:left; border-bottom:1px solid var(--line); overflow-wrap:anywhere; }
  th { position:sticky; top:0; background:var(--panel); font-weight:650; }
  td.num, th.num { width:56px; color:var(--muted); }
  td.id { font-family:ui-monospace,SFMono-Regular,Consolas,monospace; }
  tbody tr:last-child td { border-bottom:0; }
  label.btn { display:inline-block; border:1px solid var(--line); border-radius:9px; padding:10px 16px; font-weight:650; cursor:pointer; }
  label.btn:hover { border-color:var(--accent); }
  #txtArea { min-height:200px; }
  .tools { display:flex; flex-wrap:wrap; align-items:center; gap:12px; margin-top:14px; }
  #searchBox { flex:1 1 220px; min-width:0; padding:10px 12px; border:1px solid var(--line); border-radius:9px; background:var(--bg); color:var(--text); font:inherit; }
  td.id.copyable { cursor:pointer; user-select:none; -webkit-tap-highlight-color:transparent; }
  td.id.copyable:hover { background:color-mix(in srgb,var(--accent) 9%,transparent); }
  td.id.copied { color:var(--ok); }
  .switchRow { display:flex; align-items:center; gap:10px; margin:18px 4px 0; cursor:pointer; width:fit-content; }
  .switch { position:relative; display:inline-block; width:46px; height:26px; flex:none; }
  .switch input { position:absolute; inset:0; width:100%; height:100%; margin:0; opacity:0; cursor:pointer; }
  .slider { position:absolute; inset:0; background:var(--line); border-radius:26px; transition:.2s; pointer-events:none; }
  .slider::before { content:""; position:absolute; width:20px; height:20px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.2s; box-shadow:0 1px 3px #0004; }
  .switch input:checked + .slider { background:var(--accent); }
  .switch input:checked + .slider::before { transform:translateX(20px); }
  .switch input:focus-visible + .slider { outline:2px solid var(--accent); outline-offset:2px; }
  code { background:var(--bg); border:1px solid var(--line); padding:2px 5px; border-radius:5px; }
</style>
</head>
<body>
<main>
  <h1>FriendCode取得</h1>
  <p class="lead">GameFriendCache.bin対応</p>
  <section class="panel">
    <label class="drop" id="dropZone" for="fileInput">
      <strong>ドロップ</strong>
      <span> GameFriendCache.bin を選択</span>
    </label>
    <input id="fileInput" type="file">
    <div id="status" role="status" aria-live="polite">ファイルを選択してください。</div>
    <div class="actions">
      <button id="downloadBtn" disabled>テキストダウンロード</button>
      <button id="copyBtn" class="secondary" disabled>テキストコピー</button>
      <button id="clearBtn" class="secondary">テキストクリア</button>
    </div>
  </section>

  <section class="panel" id="resultPanel" hidden>
    <div class="stats">
      <span>ファイル：<b id="fileName">-</b></span>
      <span>レコード：<b id="recordCount">-</b></span>
      <span>形式：<b id="fileFormat">-</b></span>
    </div>
    <div class="tools">
      <input id="searchBox" type="search" placeholder="Nickname / Id で検索" aria-label="検索">
      <span class="note" id="hitCount"></span>
    </div>
    <div class="tableWrap">
      <table id="userTable">
        <thead><tr><th class="num">#</th><th>Nickname</th><th>Id</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <div class="actions" style="margin:0 0 14px">
      <button id="csvBtn" class="secondary">CSVダウンロード</button>
      <button id="tsvBtn" class="secondary">TSVコピー</button>
    </div>
    <p class="note">各レコードをJSON形式で表示します。</p>
    <textarea id="output" spellcheck="false" aria-label="変換結果" readonly></textarea>
  </section>

  <section class="panel" id="binPanel" hidden>
    <strong>TXT→BIN 変換</strong>
    <p class="note">上で出力したTXT（またはJSON）を GameFriendCache.bin 形式に戻します。</p>
    <textarea id="txtArea" spellcheck="false" placeholder="ここにTXTを貼り付けるか、下のボタンでTXTファイルを選択してください" aria-label="TXT入力"></textarea>
    <div class="actions">
      <label class="btn" for="txtFile">TXTファイルを選択</label>
      <input id="txtFile" type="file" accept=".txt,.json,text/plain,application/json">
      <button id="toBinBtn">BINに変換してダウンロード</button>
    </div>
    <label class="note" style="display:block;margin-top:10px"><input type="checkbox" id="gzipCheck" checked> GZIP圧縮する（元のGameFriendCache.binと同じ形式）</label>
    <div id="status2" role="status" aria-live="polite" style="min-height:26px;color:var(--muted);margin-top:8px"></div>
  </section>
  <label class="switchRow">
    <span class="switch"><input type="checkbox" id="binToggle" role="switch"><span class="slider"></span></span>
    <span class="note">逆変換</span>
  </label>
  <div id="installRow" hidden style="margin-top:14px">
    <button id="installBtn" class="secondary" hidden>アプリとしてインストール</button>
    <p class="note" id="iosHint" hidden style="margin:0">共有ボタン →「ホーム画面に追加」でアプリとして使えます。</p>
  </div>
</main>
<script>
(() => {
  const input = document.getElementById('fileInput');
  const zone = document.getElementById('dropZone');
  const status = document.getElementById('status');
  const output = document.getElementById('output');
  const downloadBtn = document.getElementById('downloadBtn');
  const copyBtn = document.getElementById('copyBtn');
  const clearBtn = document.getElementById('clearBtn');
  const panel = document.getElementById('resultPanel');
  let convertedText = '';
  let sourceName = 'GameFriendCache';

  function stamp() {
    const d = new Date(), z = n => String(n).padStart(2, '0');
    return d.getFullYear() + z(d.getMonth() + 1) + z(d.getDate()) + '_' + z(d.getHours()) + z(d.getMinutes()) + z(d.getSeconds());
  }

  function setStatus(message, type='') {
    status.textContent = message;
    status.className = type;
  }

  function formatData(data) {
    if (Array.isArray(data)) {
      return data.map(item => JSON.stringify(item, null, 2)).join('\n\n') + (data.length ? '\n' : '');
    }
    if (data && typeof data === 'object') return JSON.stringify(data, null, 2) + '\n';
    return String(data) + '\n';
  }

  function findKey(obj, names, depth = 0) {
    if (!obj || typeof obj !== 'object' || depth > 4) return undefined;
    if (!Array.isArray(obj)) {
      for (const k of Object.keys(obj)) {
        if (names.includes(k.toLowerCase()) && obj[k] !== null && typeof obj[k] !== 'object') return obj[k];
      }
    }
    for (const v of Object.values(obj)) {
      const r = findKey(v, names, depth + 1);
      if (r !== undefined) return r;
    }
    return undefined;
  }

  function extractRows(data) {
    let list;
    if (Array.isArray(data)) list = data;
    else if (data && typeof data === 'object') {
      const arr = Object.values(data).find(v => Array.isArray(v));
      list = arr || (findKey(data, ['nickname']) !== undefined ? [data] : Object.values(data));
    } else list = [];
    return list.map(item => ({
      nickname: findKey(item, ['nickname', 'nick_name', 'nick']),
      id: findKey(item, ['id', 'userid', 'user_id'])
    }));
  }

  let currentRows = [];
  const searchBox = document.getElementById('searchBox');
  const hitCount = document.getElementById('hitCount');
  const cellText = v => (v === undefined || v === null) ? '' : String(v);

  async function copyText(text) {
    try {
      await navigator.clipboard.writeText(text);
      return true;
    } catch {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.cssText = 'position:fixed;opacity:0;min-height:0';
      document.body.appendChild(ta);
      ta.select();
      let ok = false;
      try { ok = document.execCommand('copy'); } catch {}
      ta.remove();
      return ok;
    }
  }

  function renderTable(data) {
    currentRows = extractRows(data).map((r, i) => ({ no: i + 1, nickname: cellText(r.nickname), id: cellText(r.id) }));
    searchBox.value = '';
    applyFilter();
  }

  function filteredRows() {
    const q = searchBox.value.trim().toLowerCase();
    if (!q) return currentRows;
    return currentRows.filter(r => r.nickname.toLowerCase().includes(q) || r.id.toLowerCase().includes(q));
  }

  function applyFilter() {
    const rows = filteredRows();
    const tbody = document.querySelector('#userTable tbody');
    tbody.textContent = '';
    rows.forEach(row => {
      const tr = document.createElement('tr');
      [[String(row.no), 'num'], [row.nickname || '-', ''], [row.id || '-', 'id']].forEach(([text, cls]) => {
        const td = document.createElement('td');
        td.textContent = text;
        if (cls) td.className = cls;
        if (cls === 'id' && row.id) {
          td.classList.add('copyable');
          td.setAttribute('role', 'button');
          td.tabIndex = 0;
          td.title = 'タップでIdをコピー';
          const doCopy = async () => {
            const ok = await copyText(row.id);
            td.textContent = ok ? 'コピーしました' : 'コピー失敗';
            td.classList.toggle('copied', ok);
            setTimeout(() => { td.textContent = row.id; td.classList.remove('copied'); }, 1000);
          };
          td.addEventListener('click', doCopy);
          td.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); doCopy(); } });
        }
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    hitCount.textContent = currentRows.length
      ? (rows.length === currentRows.length ? currentRows.length + '件' : rows.length + ' / ' + currentRows.length + '件')
      : '';
  }

  searchBox.addEventListener('input', applyFilter);

  function buildTable(sep, quote) {
    const esc = v => quote ? '"' + v.replace(/"/g, '""') + '"' : v.replace(/[\t\r\n]+/g, ' ');
    const lines = [['Nickname', 'Id'], ...filteredRows().map(r => [r.nickname, r.id])];
    return lines.map(cols => cols.map(esc).join(sep)).join('\r\n') + '\r\n';
  }

  document.getElementById('csvBtn').addEventListener('click', () => {
    if (!currentRows.length) return;
    const blob = new Blob(['\ufeff' + buildTable(',', true)], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = sourceName + '_list_' + stamp() + '.csv';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    setStatus('CSVを保存しました（' + filteredRows().length + '件）。', 'ok');
  });

  document.getElementById('tsvBtn').addEventListener('click', async () => {
    if (!currentRows.length) return;
    const ok = await copyText(buildTable('\t', false));
    setStatus(ok ? 'TSVをコピーしました（' + filteredRows().length + '件）' : 'コピーに失敗しました。', ok ? 'ok' : 'error');
  });

  async function readFile(file) {
    if (!file) return;
    setStatus('読み込み・解析中です…');
    downloadBtn.disabled = true;
    copyBtn.disabled = true;
    panel.hidden = true;

    try {
      const bytes = await file.arrayBuffer();
      const view = new Uint8Array(bytes);
      const isGzip = view.length >= 2 && view[0] === 0x1f && view[1] === 0x8b;
      let decodedBytes = bytes;
      let format = 'JSON（非圧縮）';

      if (isGzip) {
        if (typeof DecompressionStream === 'undefined') {
          throw new Error('このブラウザーはGZIP解凍に対応していません。Chrome、Edge、Firefoxなどの最新版を使用してください。');
        }
        const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
        decodedBytes = await new Response(stream).arrayBuffer();
        format = 'JSON';
      }

      const text = new TextDecoder('utf-8', { fatal: true }).decode(decodedBytes);
      let data;
      try {
        data = JSON.parse(text);
      } catch (e) {
        throw new Error('JSONとして解析できませんでした。ファイルがGameFriendCache.binか確認してください。');
      }

      convertedText = formatData(data);
      sourceName = file.name.replace(/\.[^.]+$/, '') || 'GameFriendCache';
      output.value = convertedText;
      renderTable(data);
      document.getElementById('fileName').textContent = file.name;
      document.getElementById('recordCount').textContent = Array.isArray(data) ? data.length : (data && typeof data === 'object' ? '1（単一オブジェクト）' : '対象外');
      document.getElementById('fileFormat').textContent = format;
      panel.hidden = false;
      downloadBtn.disabled = false;
      copyBtn.disabled = false;
      setStatus(`変換しました。${convertedText.length.toLocaleString()}文字を出力しました。`, 'ok');
    } catch (err) {
      convertedText = '';
      setStatus(err && err.message ? err.message : '読み込みに失敗しました。', 'error');
    }
  }

  input.addEventListener('change', () => readFile(input.files[0]));
  ['dragenter','dragover'].forEach(type => zone.addEventListener(type, e => {
    e.preventDefault(); zone.classList.add('drag');
  }));
  ['dragleave','drop'].forEach(type => zone.addEventListener(type, e => {
    e.preventDefault(); zone.classList.remove('drag');
  }));
  zone.addEventListener('drop', e => readFile(e.dataTransfer.files[0]));

  downloadBtn.addEventListener('click', () => {
    if (!convertedText) return;
    const blob = new Blob([convertedText], {type:'text/plain;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = sourceName + '_contents_' + stamp() + '.txt';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  });

  copyBtn.addEventListener('click', async () => {
    if (!convertedText) return;
    try {
      await navigator.clipboard.writeText(convertedText);
      setStatus('変換結果をクリップボードにコピーしました。', 'ok');
    } catch {
      output.focus(); output.select();
      setStatus('自動コピーできません。選択されたテキストを手動でコピーしてください。', 'error');
    }
  });

  clearBtn.addEventListener('click', () => {
    input.value = '';
    output.value = '';
    document.querySelector('#userTable tbody').textContent = '';
    currentRows = [];
    searchBox.value = '';
    hitCount.textContent = '';
    convertedText = '';
    panel.hidden = true;
    downloadBtn.disabled = true;
    copyBtn.disabled = true;
    setStatus('ファイルを選択してください。');
  });

  const txtArea = document.getElementById('txtArea');
  const txtFile = document.getElementById('txtFile');
  const toBinBtn = document.getElementById('toBinBtn');
  const gzipCheck = document.getElementById('gzipCheck');
  const status2 = document.getElementById('status2');

  function setStatus2(message, color) {
    status2.textContent = message;
    status2.style.color = color || 'var(--muted)';
  }

  function parseLoose(text) {
    try { return JSON.parse(text); } catch {}
    const items = [];
    let depth = 0, start = -1, inStr = false, esc = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (inStr) {
        if (esc) esc = false;
        else if (c === '\\') esc = true;
        else if (c === '"') inStr = false;
        continue;
      }
      if (c === '"') { inStr = true; continue; }
      if (c === '{' || c === '[') { if (depth === 0) start = i; depth++; }
      else if (c === '}' || c === ']') {
        depth--;
        if (depth < 0) throw new Error('括弧の対応がおかしい箇所があります。');
        if (depth === 0 && start >= 0) { items.push(JSON.parse(text.slice(start, i + 1))); start = -1; }
      }
    }
    if (depth !== 0 || !items.length) throw new Error('JSONとして解析できませんでした。TXTの内容を確認してください。');
    return items;
  }

  txtFile.addEventListener('change', async () => {
    const f = txtFile.files[0];
    if (!f) return;
    txtArea.value = await f.text();
    setStatus2(f.name + ' を読み込みました。');
  });

  toBinBtn.addEventListener('click', async () => {
    try {
      const raw = txtArea.value.trim();
      if (!raw) throw new Error('TXTが空です。');
      const data = parseLoose(raw);
      const json = JSON.stringify(data);
      let blob = new Blob([json], { type: 'application/octet-stream' });
      if (gzipCheck.checked) {
        if (typeof CompressionStream === 'undefined') throw new Error('このブラウザーはGZIP圧縮に対応していません。チェックを外すか、最新のブラウザーを使用してください。');
        blob = await new Response(blob.stream().pipeThrough(new CompressionStream('gzip'))).blob();
      }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'GameFriendCache.bin';
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      const n = Array.isArray(data) ? data.length + '件' : '1件';
      setStatus2('GameFriendCache.bin を作成しました（' + n + '、' + blob.size.toLocaleString() + 'バイト）。', 'var(--ok)');
    } catch (err) {
      setStatus2(err && err.message ? err.message : '変換に失敗しました。', 'var(--error)');
    }
  });

  const binToggle = document.getElementById('binToggle');
  const binPanel = document.getElementById('binPanel');
  try { binToggle.checked = localStorage.getItem('binPanelVisible') === '1'; } catch {}
  binPanel.hidden = !binToggle.checked;
  binToggle.addEventListener('change', () => {
    binPanel.hidden = !binToggle.checked;
    try { localStorage.setItem('binPanelVisible', binToggle.checked ? '1' : '0'); } catch {}
  });
})();
</script>

  touch.rel = 'apple-touch-icon';
  touch.href = ICON_192;
  document.head.appendChild(touch);

  // マニフェストは http(s) で開いたときだけ有効（file:// ではインストール不可）
  if (/^https?:$/.test(location.protocol)) {
    const dark = matchMedia('(prefers-color-scheme: dark)').matches;
    const manifest = {
      name: 'FriendCode取得',
      short_name: 'FriendCode',
      description: 'GameFriendCache.bin から Nickname と Id を取り出すツール',
      lang: 'ja',

        { src: ICON_512, sizes: '512x512', type: 'image/png', purpose: 'any' }

    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' }));
    document.head.appendChild(link);
  }

  // インストールボタン
  const row = document.getElementById('installRow');
  const btn = document.getElementById('installBtn');
  const iosHint = document.getElementById('iosHint');
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  let deferred = null;

  if (!standalone) {
    const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    if (ios) { iosHint.hidden = false; row.hidden = false; }
    window.addEventListener('beforeinstallprompt', e => {
      e.preventDefault();
      deferred = e;
      btn.hidden = false;
      row.hidden = false;
    });
    btn.addEventListener('click', async () => {
      if (!deferred) return;
      deferred.prompt();
      await deferred.userChoice.catch(() => {});
      deferred = null;
      btn.hidden = true;
      row.hidden = true;
    });
